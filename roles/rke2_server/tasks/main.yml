---
# RKE2 Server (Control Plane) — installation & configuration

- name: Check if RKE2 is already installed
  stat:
    path: /usr/local/bin/rke2
  register: rke2_binary

- name: Install RKE2 server from local artifacts (airgap)
  shell: |
    INSTALL_RKE2_ARTIFACT_PATH="{{ artifacts_remote_path }}" \
    INSTALL_RKE2_TYPE="server" \
    INSTALL_RKE2_VERSION="{{ rke2_version }}" \
    bash {{ artifacts_remote_path }}/install.sh
  args:
    executable: /bin/bash
  when: not rke2_binary.stat.exists
  register: rke2_install_result

- name: Display installation output
  debug:
    var: rke2_install_result.stdout_lines
  when: rke2_install_result is changed

- name: Build server configuration
  set_fact:
    rke2_server_config:
      write-kubeconfig-mode: "0644"
      token: "{{ rke2_token }}"
      tls-san:
        - "{{ ansible_host }}"
        - "{{ hostname_override }}"
      node-ip: "{{ ansible_host }}"
      node-name: "{{ hostname_override}}"

- name: Write server config.yaml
  copy:
    content: "{{ rke2_server_config | to_nice_yaml(indent=2) }}"
    dest: "{{ rke2_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Enable and start rke2-server
  systemd:
    name: rke2-server
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for rke2-server to be active (max 5 min)
  wait_for:
    host: "{{ ansible_host }}"
    port: "{{ rke2_api_port }}"
    timeout: 300
    delay: 60

- name: Add kubectl & etcdctl environment to ubuntu bashrc
  blockinfile:
    path: /home/ubuntu/.bashrc
    marker: "# {mark} ANSIBLE MANAGED - RKE2 tools"
    block: |
      export KUBECONFIG={{ rke2_kubeconfig_path }}
      export PATH={{ rke2_kubectl_bin_dir }}:$PATH

      export ETCDCTL_ENDPOINTS=https://127.0.0.1:2379
      export ETCDCTL_CACERT={{ rke2_data_dir }}/server/tls/etcd/server-ca.crt
      export ETCDCTL_CERT={{ rke2_data_dir }}/server/tls/etcd/server-client.crt
      export ETCDCTL_KEY={{ rke2_data_dir }}/server/tls/etcd/server-client.key

      alias crictl='sudo crictl'
    create: true

- name: Add kubectl & etcdctl environment to root bashrc
  blockinfile:
    path: /root/.bashrc
    marker: "# {mark} ANSIBLE MANAGED - RKE2 tools"
    block: |
      export KUBECONFIG={{ rke2_kubeconfig_path }}
      export PATH={{ rke2_kubectl_bin_dir }}:$PATH

      export ETCDCTL_ENDPOINTS=https://127.0.0.1:2379
      export ETCDCTL_CACERT={{ rke2_data_dir }}/server/tls/etcd/server-ca.crt
      export ETCDCTL_CERT={{ rke2_data_dir }}/server/tls/etcd/server-client.crt
      export ETCDCTL_KEY={{ rke2_data_dir }}/server/tls/etcd/server-client.key

      alias crictl='sudo crictl'
    create: true

- name: Set kubectl environment for subsequent tasks
  set_fact:
    kubectl_env:
      KUBECONFIG: "{{ rke2_kubeconfig_path }}"
      PATH: "{{ rke2_kubectl_bin_dir }}:{{ ansible_env.PATH }}"

- name: Wait for node to be Ready
  shell: kubectl get nodes {{ hostname_override }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  environment: "{{ kubectl_env }}"
  register: node_ready
  until: node_ready.stdout == "True" and node_ready.rc == 0
  retries: 60
  delay: 10

- name: Check if etcdctl is already installed
  stat:
    path: /usr/local/bin/etcdctl
  register: etcdctl_stat

- name: Detect etcd version from running container
  shell: |
    /var/lib/rancher/rke2/bin/crictl ps --name etcd -q 2>/dev/null \
      | head -1 \
      | xargs -I {} /var/lib/rancher/rke2/bin/crictl exec {} etcdctl version 2>/dev/null \
      | head -1 \
      | awk '{print $3}'
  register: etcd_raw_ver
  changed_when: false
  failed_when: false
  when: not etcdctl_stat.stat.exists

- name: Download and install etcdctl (matching cluster version)
  unarchive:
    src: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_raw_ver.stdout }}/etcd-v{{ etcd_raw_ver.stdout }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts:
      - --strip-components=1
      - --wildcards
      - "*/etcdctl"
    owner: root
    group: root
    mode: "0755"
  when:
    - not etcdctl_stat.stat.exists
    - etcd_raw_ver.stdout is defined
    - etcd_raw_ver.stdout != ""

- name: Copy crictl config to standard location (world-readable)
  copy:
    src: "{{ rke2_data_dir }}/agent/etc/crictl.yaml"
    dest: /etc/crictl.yaml
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Verify nodes (kubectl get nodes -o wide)
  shell: kubectl get nodes -o wide
  environment: "{{ kubectl_env }}"
  register: verify_nodes
  changed_when: false

- name: Verify system pods (kubectl get pods -A)
  shell: kubectl get pods -A
  environment: "{{ kubectl_env }}"
  register: verify_pods
  changed_when: false

- name: Verify etcd cluster members
  shell: etcdctl member list
  environment: "{{ kubectl_env }}"
  register: verify_etcd_members
  changed_when: false
  failed_when: false

- name: Verify etcd endpoint health
  shell: etcdctl endpoint health -w table
  environment: "{{ kubectl_env }}"
  register: verify_etcd_health
  changed_when: false
  failed_when: false

- name: Verify running containers (crictl ps)
  shell: /var/lib/rancher/rke2/bin/crictl ps
  register: verify_crictl
  changed_when: false
  failed_when: false

- name: Display verification summary
  debug:
    msg:
      - "✅ RKE2 Control Plane installed successfully!"
      - ""
      - "── Nodes ──"
      - "{{ verify_nodes.stdout }}"
      - ""
      - "── System Pods ──"
      - "{{ verify_pods.stdout }}"
      - ""
      - "── etcd Members ──"
      - "{{ verify_etcd_members.stdout | default('N/A - etcdctl not yet available') }}"
      - ""
      - "── etcd Health ──"
      - "{{ verify_etcd_health.stdout | default('N/A') }}"
      - ""
      - "── Containers ──"
      - "{{ verify_crictl.stdout | default('N/A') }}"