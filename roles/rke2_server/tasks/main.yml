---
# RKE2 Server (Control Plane) — installation & configuration

- name: Check if RKE2 is already installed
  stat:
    path: /usr/local/bin/rke2
  register: rke2_binary

- name: Install RKE2 server from local artifacts (airgap)
  shell: |
    INSTALL_RKE2_ARTIFACT_PATH="{{ artifacts_remote_path }}" \
    INSTALL_RKE2_TYPE="server" \
    INSTALL_RKE2_VERSION="{{ rke2_version }}" \
    bash {{ artifacts_remote_path }}/install.sh
  args:
    executable: /bin/bash
  when: not rke2_binary.stat.exists
  register: rke2_install_result

- name: Display installation output
  debug:
    var: rke2_install_result.stdout_lines
  when: rke2_install_result is changed

- name: Build server configuration
  set_fact:
    rke2_server_config:
      write-kubeconfig-mode: "0644"
      token: "{{ rke2_token }}"
      tls-san:
        - "{{ ansible_host }}"
        - "{{ hostname_override }}"
      node-ip: "{{ ansible_host }}"
      node-name: "{{ hostname_override}}"

- name: Write server config.yaml
  copy:
    content: "{{ rke2_server_config | to_nice_yaml(indent=2) }}"
    dest: "{{ rke2_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart rke2-server

- name: Enable and start rke2-server
  systemd:
    name: rke2-server
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for rke2-server to be active (max 10 min)
  wait_for:
    host: "{{ ansible_host }}"
    port: "{{ rke2_api_port }}"
    timeout: 600
    delay: 30

- name: Add kubectl environment to user bashrc
  blockinfile:
    path: /home/ubuntu/.bashrc
    marker: "# {mark} ANSIBLE MANAGED - RKE2 kubectl"
    block: |
      export KUBECONFIG={{ rke2_kubeconfig_path }}
      export PATH={{ rke2_kubectl_bin_dir }}:$PATH
    create: true

- name: Add kubectl environment to root bashrc
  blockinfile:
    path: /root/.bashrc
    marker: "# {mark} ANSIBLE MANAGED - RKE2 kubectl"
    block: |
      export KUBECONFIG={{ rke2_kubeconfig_path }}
      export PATH={{ rke2_kubectl_bin_dir }}:$PATH
    create: true

- name: Set kubectl environment for subsequent tasks
  set_fact:
    kubectl_env:
      KUBECONFIG: "{{ rke2_kubeconfig_path }}"
      PATH: "{{ rke2_kubectl_bin_dir }}:{{ ansible_env.PATH }}"

- name: Wait for node to be Ready
  shell: kubectl get nodes {{ hostname_override }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  environment: "{{ kubectl_env }}"
  register: node_ready
  until: node_ready.stdout == "True" and node_ready.rc == 0
  retries: 60
  delay: 10

- name: Get cluster nodes
  shell: kubectl get nodes
  environment: "{{ kubectl_env }}"
  register: kubectl_get_nodes
  changed_when: false

- name: Display success message and cluster nodes
  debug:
    msg:
      - "RKE2 Control Plane installed successfully!"
      - ""
      - "kubectl get nodes:"
      - "{{ kubectl_get_nodes.stdout }}"