---
# RKE2 Agent (Worker) — installation & configuration

- name: Check if RKE2 is already installed
  stat:
    path: /usr/local/bin/rke2
  register: rke2_binary

- name: Install RKE2 agent from local artifacts (airgap)
  shell: |
    INSTALL_RKE2_ARTIFACT_PATH="{{ artifacts_remote_path }}" \
    INSTALL_RKE2_TYPE="agent" \
    INSTALL_RKE2_VERSION="{{ rke2_version }}" \
    bash {{ artifacts_remote_path }}/install.sh
  args:
    executable: /bin/bash
  when: not rke2_binary.stat.exists
  register: rke2_install_result

- name: Display installation output
  debug:
    var: rke2_install_result.stdout_lines
  when: rke2_install_result is changed

- name: Build agent configuration
  set_fact:
    rke2_agent_config:
      server: "https://{{ rke2_server_ip }}:9345"
      token: "{{ rke2_token }}"
      node-ip: "{{ ansible_host }}"
      node-name: "{{ hostname_override}}"

- name: Write agent config.yaml
  copy:
    content: "{{ rke2_agent_config | to_nice_yaml(indent=2) }}"
    dest: "{{ rke2_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Enable and start rke2-agent
  systemd:
    name: rke2-agent
    state: started
    enabled: true
    daemon_reload: true

- name: Set kubectl environment for subsequent tasks
  set_fact:
    kubectl_env:
      KUBECONFIG: "{{ rke2_kubeconfig_path }}"
      PATH: "{{ rke2_kubectl_bin_dir }}:{{ hostvars[groups['control_planes'][0]].ansible_env.PATH }}"

- name: Wait for worker to be Ready (verified from control-plane)
  shell: kubectl get nodes {{ hostname_override }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  environment: "{{ kubectl_env }}"
  register: worker_ready
  until: worker_ready.stdout == "True"
  retries: 20
  delay: 15
  changed_when: false
  delegate_to: "{{ groups['control_planes'][0] }}"

- name: Label worker node (verified from control-plane)
  shell: kubectl label node {{ hostname_override }} node-role.kubernetes.io/worker=worker --overwrite
  environment: "{{ kubectl_env }}"
  changed_when: false
  delegate_to: "{{ groups['control_planes'][0] }}"

- name: Get cluster nodes from control plane
  shell: kubectl get nodes
  environment: "{{ kubectl_env }}"
  register: kubectl_get_nodes
  changed_when: false
  delegate_to: "{{ groups['control_planes'][0] }}"

- name: Display success message and cluster nodes
  debug:
    msg:
      - "Worker {{ inventory_hostname }} joined the cluster successfully!"
      - ""
      - "kubectl get nodes:"
      - "{{ kubectl_get_nodes.stdout }}"